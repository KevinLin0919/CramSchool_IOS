name: iOS starter workflow

on:
  push:
    branches: [ "main", "coreml-xfeat", "demo-*", "client-*", "scan-*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile check (iOS Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project AutoGradeScanner.xcodeproj \
            -scheme AutoGradeScanner \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator"

  selftest:
    name: Demo grading self-test (simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(next(dev['udid'] for devs in data['devices'].values()
                     for dev in devs if dev.get('isAvailable') and 'iPhone' in dev['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
      - name: Build (Debug, simulator)
        run: |
          xcodebuild build \
            -project AutoGradeScanner.xcodeproj \
            -scheme AutoGradeScanner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build
      - name: Install app
        run: xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AutoGradeScanner.app
      - name: Live-scan self-test (partial views, pan across the page)
        run: |
          F="$PWD/TestFixtures"
          # Pan across the page, then hold on it. The tail of repeated
          # whole-page frames is not padding: a cell is only written off after
          # several CONSECUTIVE looks that read nothing, and six frames total
          # is fewer looks than a teacher gives a page in the first second.
          # Feeding only the pan tested the engine under a condition the real
          # flow never produces.
          SIMCTL_CHILD_DEMO_SELFTEST_LIVE="$F/scan_top.jpg,$F/scan_top.jpg,$F/scan_bottom.jpg,$F/scan_bottom.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg,$F/scan_full.jpg" \
          SIMCTL_CHILD_DEMO_SELFTEST_OUT="$PWD/selftest_live.png" \
          xcrun simctl launch --terminate-running-process --console-pty "$UDID" \
            com.cramschool.autogradescanner | tee live.log
          grep -q "SELFTEST LIVE final: 8 graded" live.log
          # Per-question assertions moved here from the still self-test, which
          # graded against the template's canned answers and so could not fail
          # on a recognition regression. These are real readings. Q1 is at the
          # top of the sheet and Q7 near the bottom, so between them they cover
          # both template windows the partial matcher uses.
          grep -Eq "SELFTEST LIVE Q1 .*recognized=12 correct=true" live.log
          grep -Eq "SELFTEST LIVE Q7 .*recognized=20 correct=true" live.log
      - name: On-device recognition self-test
        run: |
          SIMCTL_CHILD_RECOGNITION_SELFTEST="$PWD/TestFixtures/digit_cnn_reference.json" \
          xcrun simctl launch --terminate-running-process --console-pty "$UDID" \
            com.cramschool.autogradescanner | tee recog.log
          # The Core ML conversion happened on Linux, where it cannot be run —
          # this is the first and only execution of those weights.
          grep -q "RECOG PASS model.load" recog.log
          grep -q "RECOG PASS model.matchesReference" recog.log
          # The only real handwriting we have. Erasing the printed box border
          # is what makes these readable at all, so guard both the score and
          # the fact that the filter is still doing something.
          grep -q "RECOG PASS real.printedMarksRemoved" recog.log
          grep -q "RECOG PASS real.filterHelps" recog.log
          # Real ○/✗ off a worksheet. Named explicitly rather than left to the
          # blanket FAIL check below, because the way this one breaks is the
          # fixture going missing — and a check that never ran leaves no FAIL
          # line to catch.
          grep -q "RECOG PASS mark.realInk" recog.log
          grep -q "RECOG PASS mark.noConfidentMisread" recog.log
          # The circle/cross forest was fitted off-device. If the feature
          # extraction here drifts from the one that trained it, the model is
          # silently fed a distribution it never saw — accuracy falls and
          # nothing else in this suite goes red. Named explicitly for the same
          # reason as the two above: a check that never ran leaves no FAIL line.
          grep -q "RECOG PASS mark.featuresMatchTrainer" recog.log
          grep -q "RECOG PASS mark.forestMatchesTrainer" recog.log
          # Recognition reads cells out of the capture buffer, where CoreImage's
          # origin is bottom-left and every quad here is top-left. A wrong flip
          # would sample the mirror image and fail silently.
          grep -q "RECOG PASS source.bufferPathAgrees" recog.log
          ! grep -q "RECOG FAIL" recog.log
      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-output
          path: |
            selftest_*.png
            live.log
            recog.log

  ipa:
    name: Build unsigned .ipa for sideloading
    runs-on: macos-latest
    # Kept after TestFlight exists, deliberately. Signing is the one step here
    # that depends on Apple agreeing to something, and when it stops agreeing
    # this is the path that still puts a build on a phone.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build (Release, device, unsigned)
        run: |
          xcodebuild build \
            -project AutoGradeScanner.xcodeproj \
            -scheme AutoGradeScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/AutoGradeScanner.app" Payload/
          zip -qry AutoGradeScanner.ipa Payload
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGradeScanner-ipa
          path: AutoGradeScanner.ipa

  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-latest
    # main only for pushes. Every other branch is somebody's work in
    # progress, and a build number spent on one is a build number Apple will
    # never accept again. A manual dispatch is exempt because it is somebody
    # deciding, which is the only way to test this job before main has it.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [build, selftest]

    env:
      TEAM_ID: 72QM8HTFG6
      BUNDLE_ID: com.cramschool.autogradescanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put the App Store Connect key where xcodebuild expects it
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # Outside the workspace: the repo is public, and a key written into
          # the checkout is one `actions/upload-artifact` away from being
          # published. RUNNER_TEMP is wiped with the runner.
          mkdir -p "$RUNNER_TEMP/keys"
          chmod 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # Say whether it arrived intact without echoing a byte of it.
          head -1 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            | grep -q 'BEGIN PRIVATE KEY' && echo "key looks well-formed"

      - name: Archive (Release, device, signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # `-allowProvisioningUpdates` is what lets a machine with no
          # certificates sign: Xcode asks App Store Connect for the
          # certificate and profile, using the same key that will later do
          # the upload. DEVELOPMENT_TEAM is passed here rather than written
          # into the project, so the unsigned job above stays unsigned.
          #
          # This step signs for DEVELOPMENT, and that is correct even though
          # the build is going to App Store Connect. Archiving under automatic
          # signing always uses a development identity; the distribution
          # identity is applied by the export step below, which re-signs.
          # Naming `CODE_SIGN_IDENTITY=Apple Distribution` here does not move
          # that forward, it just makes Xcode refuse the contradiction.
          #
          # The consequence is that the team must have at least one registered
          # device, because a development profile is defined as being pinned
          # to devices. That is the whole of what "your team has no devices"
          # was telling us.
          #
          # CURRENT_PROJECT_VERSION is the build number, and Apple refuses a
          # repeat. A re-run of this workflow reuses its run number, so a
          # rejected upload is re-driven by pushing a commit, not by pressing
          # re-run.
          xcodebuild archive \
            -project AutoGradeScanner.xcodeproj \
            -scheme AutoGradeScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AutoGradeScanner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export a signed .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # `sed` rather than a bare heredoc: the body has to be indented to
          # satisfy YAML, and an XML declaration with whitespace in front of
          # it is not a well-formed document.
          sed 's/^[[:space:]]*//' > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AutoGradeScanner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Show what was signed
        run: |
          # Exporting cannot tell you WHO signed the thing, and a build signed
          # by the wrong identity fails at upload with a message about
          # entitlements rather than about signing.
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa)
          unzip -qo "$IPA" -d "$RUNNER_TEMP/unpacked"
          codesign -dv --verbose=2 "$RUNNER_TEMP/unpacked/Payload/AutoGradeScanner.app" 2>&1 \
            | grep -E 'Authority|TeamIdentifier|Identifier='
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$RUNNER_TEMP/unpacked/Payload/AutoGradeScanner.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' \
            "$RUNNER_TEMP/unpacked/Payload/AutoGradeScanner.app/Info.plist"

      - name: Upload the signed .ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGradeScanner-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa

